<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Log Analyser</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-blue-600">Driver Log Analyser</h1>
            <p class="text-gray-600">AI-powered root cause analysis for driver logs.</p>
        </header>

        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <form id="analysisForm" enctype="multipart/form-data">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Log File (.txt)</label>
                        <input type="file" name="log_file" accept=".txt" required
                            class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Driver Documentation (PDF)</label>
                        <input type="file" name="doc_file" accept=".pdf"
                            class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                        <p class="mt-2 text-xs text-gray-500 text-center">OR</p>
                        <label class="block text-sm font-medium text-gray-700 mt-2">Documentation URL</label>
                        <input type="url" name="doc_url" placeholder="https://docs.example.com"
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                </div>
                <div class="mt-6">
                    <button type="submit" id="submitBtn"
                        class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                        Analyze Logs
                    </button>
                </div>
            </form>
        </div>

        <div id="loading" class="hidden flex flex-col items-center justify-center space-y-4">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            <p class="text-gray-600">Analyzing logs and documentation... This may take a minute.</p>
        </div>

        <div id="results" class="hidden space-y-6">
            <div class="bg-white rounded-lg shadow-md p-6 border-l-4" id="classificationCard">
                <h2 class="text-xl font-bold mb-2">Root Cause Classification</h2>
                <p id="rootCauseCategory" class="text-2xl font-black mb-4"></p>
                <h3 class="font-semibold text-gray-700">Explanation:</h3>
                <p id="rootCauseExplanation" class="text-gray-600 whitespace-pre-wrap"></p>
                <div id="relevantReference" class="mt-4 p-3 bg-gray-50 rounded italic text-sm text-gray-500 hidden"></div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-bold mb-4">Extracted Errors</h2>
                <div id="errorList" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('analysisForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const formData = new FormData(form);

            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');
            const submitBtn = document.getElementById('submitBtn');

            resultsDiv.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50');

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Analysis failed');
                }

                const data = await response.json();
                displayResults(data);
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                loadingDiv.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50');
            }
        });

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            const categoryEl = document.getElementById('rootCauseCategory');
            const explanationEl = document.getElementById('rootCauseExplanation');
            const referenceEl = document.getElementById('relevantReference');
            const errorListEl = document.getElementById('errorList');
            const classificationCard = document.getElementById('classificationCard');

            // Category styling
            categoryEl.innerText = data.root_cause.category;
            if (data.root_cause.category === 'Configuration Issue') {
                classificationCard.classList.add('border-yellow-500');
                categoryEl.classList.add('text-yellow-600');
            } else if (data.root_cause.category === 'Documented / Known Behavior') {
                classificationCard.classList.add('border-blue-500');
                categoryEl.classList.add('text-blue-600');
            } else {
                classificationCard.classList.add('border-red-500');
                categoryEl.classList.add('text-red-600');
            }

            explanationEl.innerText = data.root_cause.explanation;

            if (data.root_cause.relevant_reference) {
                referenceEl.innerText = 'Reference: ' + data.root_cause.relevant_reference;
                referenceEl.classList.remove('hidden');
            } else {
                referenceEl.classList.add('hidden');
            }

            errorListEl.innerHTML = '';
            data.extracted_errors.forEach(err => {
                const div = document.createElement('div');
                div.className = 'border border-gray-200 rounded p-4 bg-gray-50';
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="inline-block px-2 py-1 rounded bg-red-100 text-red-800 text-xs font-bold uppercase">${err.error_type}</span>
                        <span class="text-xs text-gray-400">${err.timestamp || 'No timestamp'}</span>
                    </div>
                    <p class="text-sm font-mono text-gray-800 mb-2">${err.error_message}</p>
                    <div class="grid grid-cols-2 gap-4 text-xs text-gray-500">
                        <div><span class="font-semibold">Driver:</span> ${err.driver_name || 'Unknown'}</div>
                        <div><span class="font-semibold">Operation:</span> ${err.failing_operation || 'Unknown'}</div>
                    </div>
                `;
                errorListEl.appendChild(div);
            });

            resultsDiv.classList.remove('hidden');
            resultsDiv.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
